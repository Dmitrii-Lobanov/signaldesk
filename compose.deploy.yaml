services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: signaldesk-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  account-setup:
    profiles: ["setup"]
    image: signaldesk-api:local
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      DEV_EDITOR_EMAIL: ${DEV_EDITOR_EMAIL:?Set DEV_EDITOR_EMAIL}
      DEV_EDITOR_PASSWORD: ${DEV_EDITOR_PASSWORD:?Set DEV_EDITOR_PASSWORD}
      DEV_VIEWER_EMAIL: ${DEV_VIEWER_EMAIL:?Set DEV_VIEWER_EMAIL}
      DEV_VIEWER_PASSWORD: ${DEV_VIEWER_PASSWORD:?Set DEV_VIEWER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - apps/api/scripts/seed-dev-accounts.mjs
      - --protected-deploy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:3001
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data: