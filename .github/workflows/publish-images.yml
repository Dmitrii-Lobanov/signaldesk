name: Publish application images

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: 376896792178.dkr.ecr.us-east-2.amazonaws.com
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-2
          allowed-account-ids: "376896792178"
          role-to-assume: arn:aws:iam::376896792178:role/SignalDeskGitHubEcrPublisher

      - name: Authenticate Docker
        run: |
          aws ecr get-login-password --region us-east-2 |
            docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build both images
        run: |
          docker build --platform linux/amd64 \
            -f apps/api/Dockerfile \
            -t "$REGISTRY/signaldesk-api:$GITHUB_SHA" .
          docker build --platform linux/amd64 \
            -f apps/web/Dockerfile \
            -t "$REGISTRY/signaldesk-web:$GITHUB_SHA" .

      - name: Push both images
        run: |
          docker push "$REGISTRY/signaldesk-api:$GITHUB_SHA"
          docker push "$REGISTRY/signaldesk-web:$GITHUB_SHA"
          {
            echo "### Published images"
            echo "$REGISTRY/signaldesk-api:$GITHUB_SHA"
            echo "$REGISTRY/signaldesk-web:$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
