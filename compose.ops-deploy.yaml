services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: signaldesk_test
      POSTGRES_USER: signaldesk
      POSTGRES_PASSWORD: deploy-test-only-password
    volumes:
      - ops_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldesk -d signaldesk_test"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    image: signaldesk-api:ops-rehearsal
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://signaldesk:deploy-test-only-password@postgres:5432/signaldesk_test
      BETTER_AUTH_SECRET: deploy-test-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3300
      AI_SUGGESTIONS_ENABLED: "true"
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/ready', { signal: AbortSignal.timeout(5000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 3

  web:
    image: signaldesk-web:ops-rehearsal
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:3001
      AI_SUGGESTIONS_ENABLED: "true"
      PORT: "3000"
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ops_data:
